name: asaraog-run
on:
  workflow_dispatch:
    inputs:
      ref: {required: true, type: string}
      filter: {required: true, type: string}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            nlmixr2/dparser-R
            nlmixr2/lotri
            nlmixr2/rxode2ll
            nlmixr2/rxode2lincmt
            nlmixr2/PreciseSums
      - run: R CMD INSTALL .
      - run: Rscript -e 'library(rxode2); testthat::test_dir("tests/testthat", filter="${{ inputs.filter }}", package="rxode2", load_package="installed", stop_on_failure=TRUE)'
